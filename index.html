<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#80d2ef" />
    <meta name="description" content="Gugagame" />
    <meta property="og:title" content="Gugagame" />
    <meta property="og:description" content="Gugagame" />
    <meta property="og:type" content="website" />
    <title>Gugagame</title>
    <link rel="stylesheet" href="style.css?v=20260802-24" />
  </head>
  <body>
    <main class="world" aria-label="企鵝的草地">
      <button id="settings-button" class="settings-button" type="button" aria-label="開啟設定" aria-controls="settings-menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4A2 2 0 0 0 4 9.9l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <section id="settings-menu" class="settings-menu" aria-label="設定選單" aria-hidden="true"></section>
      <div class="sky" aria-hidden="true">
        <svg class="celestial sun" viewBox="0 0 100 100" role="presentation"><circle cx="50" cy="50" r="22" /><path d="M50 5v15M50 80v15M5 50h15M80 50h15M18 18l11 11M71 71l11 11M82 18 71 29M29 71 18 82" /></svg>
        <svg class="celestial moon" viewBox="0 0 100 100" role="presentation"><path d="M68 76A34 34 0 0 1 35 22a34 34 0 1 0 33 54Z" /></svg>
        <div id="cloud-layer" class="cloud-layer"></div>
        <template id="cloud-template">
          <svg class="cloud" viewBox="0 0 180 100" role="presentation"><path d="M29 79h119c17 0 28-12 28-27 0-16-13-29-29-29-5 0-10 1-14 4C125 13 110 6 94 6 71 6 52 20 46 39c-4-2-8-3-13-3C17 36 4 49 4 64s11 15 25 15Z" /></svg>
        </template>
      </div>
      <aside class="hud" aria-label="企鵝狀態">
        <div class="hud-row">
          <span class="hud-label">血量</span>
          <div class="stat-meter health" aria-label="血量：滿">
            <div class="stat-track" aria-hidden="true"><div class="stat-fill health-fill"></div></div>
          </div>
        </div>
        <div class="hud-row">
          <span class="hud-label">飽食度</span>
          <div class="stat-meter hunger" aria-label="飽食度：60%">
            <div class="stat-track" aria-hidden="true"><div class="stat-fill hunger-fill"></div></div>
          </div>
        </div>
        <div class="hud-row">
          <span class="hud-label">好感度</span>
          <div class="affection" aria-label="好感度：40%">
            <div class="affection-track" aria-hidden="true">
              <div class="affection-fill"></div>
            </div>
          </div>
        </div>
      </aside>
      <div class="grass" aria-hidden="true"></div>
      <button id="pet" class="pet" aria-label="點擊企鵝讓牠跳躍">
        <img src="assets/tuanzi-square.png" alt="企鵝" draggable="false" />
      </button>
      <!-- DEBUG ONLY: This panel is deliberately separate from game controls. -->
      <section class="debug-panel" aria-label="調試專區">
        <span>調試專區</span>
        <button id="debug-day-night" type="button">切換晝夜預覽</button>
        <button id="debug-hurt" type="button">扣血測試</button>
        <button id="debug-full-hunger" type="button">飽食滿格</button>
        <button id="debug-cloud-count" type="button">改雲數量</button>
        <button id="debug-death" type="button">死亡測試</button>
      </section>
      <section class="feature-panel" aria-label="功能專區">
        <button id="feed-button" type="button" aria-label="餵食企鵝">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-4.6-4.3-9 0-9 5.5C3 17.4 8.2 21 12 22c3.8-1 9-4.6 9-10.5C21 6 16.6 1.7 12 6Z" /><path d="M12 6c-1.5-3 1-5 4-4" /></svg>
          <span id="feed-button-label">餵食</span>
        </button>
        <div id="food-picker" class="food-picker" aria-label="選擇食物" aria-hidden="true" inert>
          <button type="button" data-food-type="apple" aria-label="拖曳蘋果"><span class="food-art food-art-apple" aria-hidden="true"></span><span>蘋果</span></button>
          <button type="button" data-food-type="stone" aria-label="拖曳石頭"><span class="food-art food-art-stone" aria-hidden="true"></span><span>石頭</span></button>
        </div>
      </section>
      <section id="death-screen" class="death-screen" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="death-title" inert>
        <div class="death-content">
          <h1 id="death-title">你死了！</h1>
          <p id="death-cause">企鵝從太高的地方摔了下來</p>
          <button id="restart-button" type="button">重新開始</button>
        </div>
      </section>
    </main>
    <script src="app.js?v=20260803-02"></script>
  </body>
</html>
