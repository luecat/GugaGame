<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#80d2ef" />
    <meta name="description" content="Gugagame" />
    <meta property="og:title" content="Gugagame" />
    <meta property="og:description" content="Gugagame" />
    <meta property="og:type" content="website" />
    <title>Gugagame</title>
    <link rel="preload" as="image" href="image/gugugaga-sing.png?v=20260803-13" />
    <link rel="stylesheet" href="style.css?v=20260805-ball8" />
  </head>
  <body>
    <main class="world" aria-label="企鵝的草地">
      <button id="settings-button" class="settings-button" type="button" aria-label="開啟設定" aria-controls="settings-menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4A2 2 0 0 0 4 9.9l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.8l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.8v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <section id="settings-menu" class="settings-menu" aria-label="設定選單" aria-hidden="true">
        <div class="volume-setting">
          <label for="volume-slider">網頁音量</label>
          <div class="volume-control">
            <input id="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="網頁音量" />
            <svg class="volume-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Z" />
              <path class="volume-wave volume-wave-inner" d="M14.5 9a4 4 0 0 1 0 6" />
              <path class="volume-wave volume-wave-outer" d="M17.5 6a8 8 0 0 1 0 12" />
              <path class="volume-muted-mark" d="m15 9 6 6m0-6-6 6" />
            </svg>
          </div>
        </div>
      </section>
      <div class="sky" aria-hidden="true">
        <svg class="celestial sun" viewBox="0 0 100 100" role="presentation"><circle cx="50" cy="50" r="22" /><path d="M50 5v15M50 80v15M5 50h15M80 50h15M18 18l11 11M71 71l11 11M82 18 71 29M29 71 18 82" /></svg>
        <svg class="celestial moon" viewBox="0 0 100 100" role="presentation"><path d="M68 76A34 34 0 0 1 35 22a34 34 0 1 0 33 54Z" /></svg>
        <div id="cloud-layer" class="cloud-layer"></div>
        <template id="cloud-template">
          <svg class="cloud" viewBox="0 0 180 100" role="presentation"><path d="M29 79h119c17 0 28-12 28-27 0-16-13-29-29-29-5 0-10 1-14 4C125 13 110 6 94 6 71 6 52 20 46 39c-4-2-8-3-13-3C17 36 4 49 4 64s11 15 25 15Z" /></svg>
        </template>
      </div>
      <aside class="hud" aria-label="企鵝狀態">
        <div class="hud-row">
          <span class="hud-label">血量</span>
          <div class="stat-meter health" aria-label="血量：滿">
            <div class="stat-track" aria-hidden="true"><div class="stat-fill health-fill"></div></div>
          </div>
        </div>
        <div class="hud-row">
          <span class="hud-label">飽食度</span>
          <div class="stat-meter hunger" aria-label="飽食度：60%">
            <div class="stat-track" aria-hidden="true"><div class="stat-fill hunger-fill"></div></div>
          </div>
        </div>
        <div class="hud-row">
          <span class="hud-label">好感度</span>
          <div class="affection" aria-label="好感度：40%">
            <div class="affection-track" aria-hidden="true">
              <div class="affection-fill"></div>
            </div>
          </div>
        </div>
      </aside>
      <div class="grass" aria-hidden="true"></div>
      <button id="pet" class="pet" aria-label="點擊企鵝讓牠跳躍">
        <img src="image/gugugaga-white.png" alt="企鵝" draggable="false" />
      </button>
      <section class="feature-panel" aria-label="功能專區">
        <div class="feature-actions">
          <button id="feed-button" type="button" aria-label="餵食企鵝">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-4.6-4.3-9 0-9 5.5C3 17.4 8.2 21 12 22c3.8-1 9-4.6 9-10.5C21 6 16.6 1.7 12 6Z" /><path d="M12 6c-1.5-3 1-5 4-4" /></svg>
            <span id="feed-button-label">餵食</span>
          </button>
          <button id="interact-button" type="button" aria-label="與企鵝互動">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H9l-5 4v-15Z" /><path d="M8 10h8M8 13h5" /></svg>
            <span id="interact-button-label">互動</span>
          </button>
          <button id="adventure-button" type="button" aria-label="開啟探險模式">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 19 6.5-6.5 3 3L20 9" /><path d="M16 9h4v4" /><path d="M4 5h7" /></svg>
            <span>探險</span>
          </button>
        </div>
        <div id="food-picker" class="food-picker" aria-label="選擇食物" aria-hidden="true" inert>
          <button type="button" data-food-type="apple" aria-label="蘋果，剩餘 99 個"><span class="food-art food-art-apple" aria-hidden="true"></span><span>蘋果</span><small class="food-quantity" aria-hidden="true">×99</small></button>
          <button type="button" data-food-type="stone" aria-label="石頭，剩餘 99 個"><span class="food-art food-art-stone" aria-hidden="true"></span><span>石頭</span><small class="food-quantity" aria-hidden="true">×99</small></button>
        </div>
        <div id="interaction-picker" class="interaction-picker" aria-label="選擇互動" aria-hidden="true" inert>
          <button id="singing-button" type="button">唱歌</button>
          <button id="ball-button" type="button">玩球</button>
          <button id="rps-button" type="button">猜拳</button>
        </div>
        <div id="singing-picker" class="singing-picker" aria-label="唱歌模式" aria-hidden="true" inert>
          <button id="cancel-singing-button" type="button">取消唱歌</button>
          <button id="singing-song-button" type="button">壱雫空</button>
        </div>
        <div id="rps-picker" class="rps-picker" aria-label="猜拳模式" aria-hidden="true" inert>
          <button id="end-rps-button" class="rps-end-button" type="button">結束猜拳</button>
          <div class="rps-choices" role="group" aria-label="選擇出拳">
            <button type="button" data-rps-choice="scissors" aria-label="出剪刀"><img src="image/剪刀.png?v=20260804-rps2" alt="" draggable="false" /><span>剪刀</span></button>
            <button type="button" data-rps-choice="rock" aria-label="出石頭"><img src="image/石頭.png?v=20260804-rps2" alt="" draggable="false" /><span>石頭</span></button>
            <button type="button" data-rps-choice="paper" aria-label="出布"><img src="image/布.png?v=20260804-rps2" alt="" draggable="false" /><span>布</span></button>
          </div>
        </div>
      </section>
      <section id="adventure-menu" class="adventure-menu" aria-label="探險模式選單" aria-hidden="true" inert>
        <div class="adventure-menu-header">
          <h1>探險模式</h1>
          <button id="close-adventure-menu" type="button">返回</button>
        </div>
        <div class="adventure-grid">
          <button class="adventure-card" type="button" data-adventure-game="catch"><svg class="adventure-card-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 14c-7-7-15 0-13 9 2 10 10 16 13 17 3-1 11-7 13-17 2-9-6-16-13-9Z"/><path d="M24 14c-2-5 1-8 6-8M27 8c4-2 7-1 9 1"/></svg><span>接接樂</span><small>接住天上掉下來的物品</small></button>
          <button class="adventure-card is-locked" type="button" disabled><svg class="adventure-card-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="m24 5 15 6v11c0 10-6 17-15 21C15 39 9 32 9 22V11l15-6Z"/><path d="m24 13 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1 3-6Z"/></svg><span>神秘地圖</span><small>敬請期待</small></button>
          <button class="adventure-card is-locked" type="button" disabled><svg class="adventure-card-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 39h32M11 35V20l13-9 13 9v15M18 35V25h12v10M7 20h34"/><path d="M24 11V6M20 7h8"/></svg><span>野外露營</span><small>敬請期待</small></button>
          <button class="adventure-card is-locked" type="button" disabled><svg class="adventure-card-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M11 8c9 2 16 9 18 18M29 26c2 2 5 3 8 3M12 9 8 5M29 26l8 8M8 43c6-7 10-13 12-19"/><path d="M8 43h12"/></svg><span>河邊釣魚</span><small>敬請期待</small></button>
          <button class="adventure-card is-locked" type="button" disabled><svg class="adventure-card-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="m9 39 24-24M20 43 44 19M5 33l10 10M29 5l14 14M12 27l9 9M27 21l9 9"/></svg><span>礦坑探險</span><small>敬請期待</small></button>
          <button class="adventure-card is-locked" type="button" disabled><svg class="adventure-card-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42V8M24 18C17 8 9 10 7 12c2 8 8 11 17 10M24 26c7-10 15-8 17-6-2 8-8 11-17 10M24 34C17 24 9 26 7 28c2 8 8 11 17 10M24 42c7-10 15-8 17-6-2 8-8 11-17 10"/></svg><span>森林漫步</span><small>敬請期待</small></button>
        </div>
      </section>
      <section id="catch-game" class="catch-game" aria-label="接接樂" aria-hidden="true" inert>
        <div class="catch-sky" aria-hidden="true"></div>
        <div class="catch-ground" aria-hidden="true"></div>
        <div class="catch-hud" aria-live="polite">
          <span class="catch-score"><span class="food-art food-art-apple" aria-hidden="true"></span><strong id="catch-apples">0</strong></span>
          <span class="catch-score"><span class="food-art food-art-stone" aria-hidden="true"></span><strong id="catch-stones">0</strong></span>
        </div>
        <button id="close-catch-game" class="catch-close" type="button">結束</button>
        <div id="catch-field" class="catch-field" aria-label="接接樂遊戲區"></div>
        <button id="catch-penguin" class="catch-penguin" type="button" aria-label="企鵝，左右移動以接住物品"><img src="image/gugugaga-white.png" alt="企鵝" draggable="false" /></button>
        <p class="catch-help">左右移動企鵝接住蘋果和石頭，避開炸藥</p>
      </section>
      <p id="rps-result" class="rps-result" aria-live="polite" aria-hidden="true">選一個出拳吧</p>
      <section id="ball-game" class="ball-game" aria-label="和企鵝玩球" aria-hidden="true" inert>
        <div class="ball-combo" aria-live="polite">連擊數 <strong id="ball-combo-value">0</strong></div>
        <div class="ball-game-bar">
          <button id="close-ball-game" type="button" aria-label="結束玩球">結束</button>
        </div>
        <span id="ball-game-status" class="ball-game-status" aria-live="polite">接住球！</span>
        <canvas id="ball-court" aria-label="玩球場地：移動球拍接住球"></canvas>
        <p class="ball-game-hint">滑鼠或手指左右移動球拍</p>
      </section>
      <section id="death-screen" class="death-screen" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="death-title" inert>
        <div class="death-content">
          <h1 id="death-title">你死了</h1>
          <p id="death-cause">企鵝從太高的地方摔了下來</p>
          <button id="restart-button" type="button">重新開始</button>
        </div>
      </section>
    </main>
    <script src="app.js?v=20260805-ball10"></script>
  </body>
</html>
