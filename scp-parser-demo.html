<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>GugaGame SCP 解析器</title>
    <link rel="stylesheet" href="scp-parser-demo.css" />
  </head>
  <body>
    <main>
      <header>
        <a href="index.html">← 回到 GugaGame</a>
        <p class="eyebrow">GugaGame 開發工具</p>
        <h1>SCP 譜面解析器</h1>
        <p>選擇 Sonolus Collection Package，所有處理都只在瀏覽器內進行，不會上傳檔案。</p>
      </header>

      <section class="picker" aria-labelledby="picker-title">
        <div>
          <h2 id="picker-title">選擇 .scp</h2>
          <p>解析 Sonolus level data、engine archetype、全部 note 與 entity reference。</p>
        </div>
        <label class="file-button">
          <span>選擇檔案</span>
          <input id="scp-file" type="file" accept=".scp,application/zip" />
        </label>
      </section>

      <p id="status" class="status" aria-live="polite">尚未選擇檔案</p>

      <section id="result" class="result" aria-labelledby="result-title" hidden>
        <div class="result-heading">
          <div>
            <p id="level-subtitle" class="eyebrow"></p>
            <h2 id="result-title"></h2>
            <p id="level-credit"></p>
          </div>
          <button id="download-json" type="button">下載完整 JSON</button>
        </div>

        <dl class="metrics">
          <div><dt>全部 entities</dt><dd id="entity-count">0</dd></div>
          <div><dt>全部 notes</dt><dd id="note-count">0</dd></div>
          <div><dt>可判定 notes</dt><dd id="playable-count">0</dd></div>
          <div><dt>Connectors</dt><dd id="connector-count">0</dd></div>
          <div><dt>BPM 變化</dt><dd id="bpm-count">0</dd></div>
          <div><dt>變速節點</dt><dd id="timescale-count">0</dd></div>
        </dl>

        <section class="panel" aria-labelledby="note-types-title">
          <h3 id="note-types-title">內部 Note 類型</h3>
          <div class="table-scroll">
            <table>
              <thead><tr><th>Archetype</th><th>數量</th><th>可判定</th></tr></thead>
              <tbody id="note-types"></tbody>
            </table>
          </div>
        </section>

        <section class="panel" aria-labelledby="warnings-title">
          <h3 id="warnings-title">解析檢查</h3>
          <ul id="warnings"></ul>
        </section>
      </section>
    </main>
    <script src="vendor/fflate-0.8.3.js"></script>
    <script src="scp-parser.js"></script>
    <script src="scp-parser-demo.js"></script>
  </body>
</html>
